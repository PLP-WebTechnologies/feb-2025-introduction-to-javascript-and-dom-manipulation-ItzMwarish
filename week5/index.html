<!-- project description -->

<!-- A playful web page where users first select their current mood, and based on that mood, 
 clicking a button will give them a fun, themed surprise — like a quote, emoji, fun fact, or uplifting message. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood-Based Surprise Box</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>Welcome to the Mood-Based Surprise Box</h1>
    <p>How are you feeling today?</p>
    <button class="Happy">Happy</button>
    <button class="Excited">Excited</button>
    <button class="calm">Calm</button>
    <button class="tired">Tired</button>
    <button class="sad">Sad</button>

    <div id="message"></div>
    <button id="reset">Reset My Mood</button>
    <footer>
      <p>&copy; 2025 . All Rights Reserved. Made by Miss Mwarish</p>
    </footer>
  </body>
</html>
